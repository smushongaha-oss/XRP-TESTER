<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V90 (1s) Signal Strength</title>
<style>
  :root{
    --bg:#050914;
    --panel:#0a1224;
    --cyan:#33d6ff;
    --cyan-dim:#1a7a99;
    --red:#ff4d4d;
    --amber:#ffb020;
    --green:#3ddc84;
    --text:#dff6ff;
    --muted:#5f7d92;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #0c1930 0%, var(--bg) 70%);
    color:var(--text);
    font-family:'Courier New', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
  }
  .frame{
    width:100%;
    max-width:640px;
    background:var(--panel);
    border:1px solid var(--cyan-dim);
    border-radius:14px;
    padding:28px 28px 24px;
    box-shadow:0 0 40px rgba(51,214,255,0.08), inset 0 0 30px rgba(51,214,255,0.03);
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .header h1{
    font-size:16px;
    letter-spacing:1px;
    margin:0;
    color:var(--cyan);
    text-shadow:0 0 8px rgba(51,214,255,0.4);
  }
  .status-dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--red);
    margin-right:6px;
    box-shadow:0 0 6px currentColor;
  }
  .status-dot.live{background:var(--green);}
  .status-line{
    font-size:11px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .price-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .price-row span.val{color:var(--text);font-size:13px;}
  svg{display:block;margin:8px auto 0;}
  #needle{transition:transform 0.6s cubic-bezier(.4,1.4,.4,1);}
  #valLabel{transition:fill 0.4s;}
  .center-value{font-size:34px;font-weight:bold;}
  .center-status{font-size:13px;letter-spacing:2px;}
  .footer-note{
    font-size:10px;
    color:var(--muted);
    text-align:center;
    margin-top:14px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="header">
    <h1>V90 (1S) &mdash; SIGNAL STRENGTH</h1>
    <div><span class="status-dot" id="statusDot"></span><span id="statusText">connecting</span></div>
  </div>
  <div class="status-line">Volatility 90 (1s) Index &middot; live CCI(14) on 1m candles</div>

  <div class="price-row"><span>Price</span><span class="val" id="priceVal">&mdash;</span></div>
  <div class="price-row"><span>CCI(14)</span><span class="val" id="cciVal">&mdash;</span></div>

  <svg width="100%" viewBox="0 0 680 340" role="img" aria-label="Signal strength gauge">
    <path d="M120,300 A220,220 0 0,1 162,171" fill="none" stroke="#7a1f1f" stroke-width="44"/>
    <path d="M162,171 A220,220 0 0,1 272,91"  fill="none" stroke="#7a4a15" stroke-width="44"/>
    <path d="M272,91  A220,220 0 0,1 408,91"  fill="none" stroke="#33465a" stroke-width="44"/>
    <path d="M408,91  A220,220 0 0,1 518,171" fill="none" stroke="#2f6b3a" stroke-width="44"/>
    <path d="M518,171 A220,220 0 0,1 560,300" fill="none" stroke="#1d4d26" stroke-width="44"/>
    <text x="90" y="325" text-anchor="middle" fill="var(--muted)" font-size="12">SELL</text>
    <text x="340" y="60" text-anchor="middle" fill="var(--muted)" font-size="12">NEUTRAL</text>
    <text x="590" y="325" text-anchor="middle" fill="var(--muted)" font-size="12">BUY</text>
    <line id="needle" x1="340" y1="300" x2="130" y2="300" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" transform="rotate(90,340,300)" style="filter:drop-shadow(0 0 4px rgba(51,214,255,0.8));"/>
    <circle cx="340" cy="300" r="10" fill="var(--cyan)" style="filter:drop-shadow(0 0 4px rgba(51,214,255,0.8));"/>
    <text id="valLabel" x="340" y="240" text-anchor="middle" fill="var(--cyan)" class="center-value" style="font-family:'Courier New',monospace;">&mdash;</text>
    <text id="statusLabel" x="340" y="266" text-anchor="middle" fill="var(--muted)" class="center-status" style="font-family:'Courier New',monospace;">WAITING</text>
  </svg>

  <div class="footer-note">
    Signal = CCI(14) on 1m candles, mapped to a 0&ndash;100 scale.<br>
    &lt;20 strong sell &middot; 20&ndash;40 sell &middot; 40&ndash;60 neutral &middot; 60&ndash;80 buy &middot; &gt;80 strong buy
  </div>
</div>

<script>
const SYMBOL = "1HZ90V";
const APP_ID = 1089;
const GRANULARITY = 60;
const CCI_PERIOD = 14;

let ws;
let candles = [];

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const priceVal = document.getElementById('priceVal');
const cciVal = document.getElementById('cciVal');
const needle = document.getElementById('needle');
const valLabel = document.getElementById('valLabel');
const statusLabel = document.getElementById('statusLabel');

function setConnState(live, label){
  statusDot.classList.toggle('live', live);
  statusText.textContent = label;
}

function connect(){
  ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

  ws.onopen = () => {
    setConnState(false, 'fetching history');
    ws.send(JSON.stringify({
      ticks_history: SYMBOL,
      adjust_start_time: 1,
      count: 200,
      end: "latest",
      granularity: GRANULARITY,
      style: "candles"
    }));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.msg_type === "candles") {
      candles = data.candles.map(c => ({
        open: parseFloat(c.open),
        high: parseFloat(c.high),
        low: parseFloat(c.low),
        close: parseFloat(c.close),
        epoch: c.epoch
      }));
      ws.send(JSON.stringify({
        ticks: SYMBOL,
        subscribe: 1
      }));
      setConnState(true, 'live');
      recompute();
    }

    if (data.msg_type === "tick") {
      const price = parseFloat(data.tick.quote);
      const epoch = data.tick.epoch;
      const candleEpoch = Math.floor(epoch / GRANULARITY) * GRANULARITY;
      const last = candles[candles.length - 1];
      if (last && last.epoch === candleEpoch) {
        last.high = Math.max(last.high, price);
        last.low = Math.min(last.low, price);
        last.close = price;
      } else {
        candles.push({ open: price, high: price, low: price, close: price, epoch: candleEpoch });
        if (candles.length > 300) candles.shift();
      }
      setConnState(true, 'live');
      recompute();
    }

    if (data.error) {
      setConnState(false, 'error: ' + data.error.message);
    }
  };

  ws.onclose = () => {
    setConnState(false, 'reconnecting');
    setTimeout(connect, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

function computeCCI(period){
  if (candles.length < period) return null;
  const slice = candles.slice(-period);
  const tps = slice.map(c => (c.high + c.low + c.close) / 3);
  const sma = tps.reduce((a,b) => a+b, 0) / period;
  const meanDev = tps.reduce((a,b) => a + Math.abs(b - sma), 0) / period;
  if (meanDev === 0) return 0;
  const currentTP = tps[tps.length - 1];
  return (currentTP - sma) / (0.015 * meanDev);
}

function recompute(){
  const cci = computeCCI(CCI_PERIOD);
  const price = candles[candles.length - 1]?.close;
  if (price !== undefined) priceVal.textContent = price.toFixed(3);
  if (cci === null) return;

  cciVal.textContent = cci.toFixed(1);

  const clamped = Math.max(-200, Math.min(200, cci));
  const value = ((clamped + 200) / 400) * 100;
  const deg = (value / 100) * 180;
  needle.setAttribute('transform', `rotate(${deg},340,300)`);
  valLabel.textContent = Math.round(value);

  let label, color;
  if (value >= 80) { label = 'STRONG BUY'; color = '#3ddc84'; }
  else if (value >= 60) { label = 'BUY'; color = '#7be0a0'; }
  else if (value >= 40) { label = 'NEUTRAL'; color = '#5f7d92'; }
  else if (value >= 20) { label = 'SELL'; color = '#ffb020'; }
  else { label = 'STRONG SELL'; color = '#ff4d4d'; }
  statusLabel.textContent = label;
  statusLabel.setAttribute('fill', color);
  valLabel.setAttribute('fill', color);
}

connect();
</script>
</body>
</html>
